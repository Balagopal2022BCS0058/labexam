version: '3.8'

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-labexam
    ports:
      - "8080:8080"   # Jenkins UI
      - "50000:50000" # Agent port
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount the BTP SSH key as a Docker secret (read-only)
      - ~/.ssh/id_ed25519_btp:/run/secrets/ssh_key:ro
    restart: unless-stopped

volumes:
  jenkins_home:
    driver: local
